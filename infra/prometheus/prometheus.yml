global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: api            # compose (`make up`)
    static_configs: [{ targets: ["api:8000"] }]
  # When running `make api` on the host instead of the compose api, point this job at
  # host.docker.internal:8000. Scraping both would double every counter.
  - job_name: consumer       # python -m stunes.ingest.consumer --metrics-port 9108
    static_configs: [{ targets: ["host.docker.internal:9108"] }]
  - job_name: quality        # stunes quality serve
    static_configs: [{ targets: ["host.docker.internal:9109"] }]
