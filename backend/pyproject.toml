[project]
name = "stunes"
version = "2.0.0"
description = "SoongTunes v2 — knowledge-graph music search with a hybrid (BM25 + dense) retrieval platform"
authors = [{ name = "guridon", email = "sujin3824@naver.com" }]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.162,<0.163",
    "uvicorn[standard]>=0.54,<0.55",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "neo4j>=6.4,<7",
    "opensearch-py[async]>=3.2,<4",
    "asyncpg>=0.32,<0.33",
    "pgvector>=0.5,<0.6",
    "numpy>=2.3,<3",
    # degree-weighted co-occurrence and PPR over the in-memory playlist graph (retrieval/ppr.py)
    "scipy>=1.18,<2",
    "openai>=3.41,<4",
    "httpx>=0.28,<0.29",
    "orjson>=3.13,<4",
    "tenacity>=9.2,<10",
    # v1 baseline strategies (Text2Cypher) are kept for regression comparison only
    "langchain>=1.4,<2",
    "langchain-neo4j>=0.11,<0.12",
    "langchain-openai>=1.7,<2",
    # Phase 5: agent orchestration
    "langgraph==1.2.16",
    # Phase 2: event ingestion (pinned to releases at least two weeks old)
    "confluent-kafka==2.16.0",
    "psycopg[binary,pool]>=3.3,<3.4",
    "redis>=8.1,<9",
    "msgpack==1.2.3",
    "pyyaml>=6.0,<7",
    # Phase 7: metrics
    "prometheus-client>=0.26,<0.27",
]

[project.scripts]
stunes = "stunes.jobs.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.17,<0.18",
]
# re-ranker: training (stunes rerank features|train) and serving in the API image (OpenMP: libgomp1)
rerank = ["lightgbm==4.7.0"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.uv]
# fastapi pulls opentelemetry-api; 1.45.2 is from 2026-10-29, newer than the two-week rule allows
# narwhals (via lightgbm): 2.28.0 is from 2026-10-27
constraint-dependencies = ["opentelemetry-api<=1.45.1", "narwhals<=2.27.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/stunes"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
# E501: the formatter owns line length; what remains is prompts and Cypher text.
# RUF001-003: Korean full-width characters in strings/comments are intentional.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/stunes/jobs/*" = ["ASYNC240"]  # offline jobs do blocking file I/O on purpose
"src/stunes/eval/run.py" = ["ASYNC221", "ASYNC240"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
