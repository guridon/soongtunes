name: stunes

# Local deployment of the whole service. The LLM/embedding servers run on a GPU host
# (vLLM, see infra/llm) and are reached through LLM_BASE_URL / EMBED_BASE_URL.
#
#   make up        # everything
#   make infra     # data stores only (for running api/web on the host)

services:
  neo4j:
    image: neo4j:2026.10.1-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
      NEO4J_server_memory_heap_initial__size: 1536m
      NEO4J_server_memory_heap_max__size: 1536m
      NEO4J_server_memory_pagecache_size: 2g
      NEO4J_db_transaction_timeout: 30s
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    restart: unless-stopped
    # postgres runs as PID 1 and adopts orphaned processes from `docker exec`; when one of them
    # exits non-zero the postmaster treats it as a crashed backend and restarts every
    # connection (troubleshooting #13). tini as PID 1 reaps them instead.
    init: true
    # parallel HNSW builds allocate maintenance_work_mem (1 GB) in dynamic shared memory;
    # Docker's default 64 MB /dev/shm made the 707k-vector index build fail (troubleshooting #15)
    shm_size: 2gb
    environment:
      POSTGRES_USER: stunes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: stunes
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - max_wal_size=4GB
      - -c
      - shared_preload_libraries=pg_stat_statements
      # logical decoding for the CDC connector (profile cdc); the default slot/sender limits (10) suffice
      - -c
      - wal_level=logical
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stunes -d stunes"]
      interval: 5s
      timeout: 3s
      retries: 20

  opensearch:
    build: infra/opensearch
    image: stunes-opensearch:3.9.0-nori
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms768m -Xmx768m
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - os_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Phase 2: Kafka-API broker. No dev-container mode: it bypasses fsync, which would make
  # commit costs in the ingestion experiments look cheaper than they are.
  redpanda:
    image: redpandadata/redpanda:v26.2.4
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      # 127.0.0.1, not localhost: localhost resolves to ::1 first and the port is bound on IPv4 only
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:19092
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "127.0.0.1:19092:19092"
      - "127.0.0.1:9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Phase 3 cache tier (L2). Cache only: no persistence.
  redis:
    image: redis:8.2.3-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: backend
    image: stunes-api:dev
    restart: unless-stopped
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      POSTGRES_DSN: postgresql://stunes:${POSTGRES_PASSWORD}@postgres:5432/stunes
      OPENSEARCH_URL: http://opensearch:9200
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP: redpanda:9092
      # the local dev embedder runs on the host; on the GPU host this equals EMBED_BASE_URL
      EMBED_BASE_URL: ${EMBED_BASE_URL_DOCKER:-http://host.docker.internal:8201/v1}
      CORS_ORIGINS: '["http://localhost:3000"]'
      # two uvicorn workers: without this each scrape saw one worker's counters at random;
      # prometheus_client's multiprocess mode needs a directory that is empty at start
      PROMETHEUS_MULTIPROC_DIR: /run/prom
      # Phase 4 ablation: `LLM_TAGS_IN_RETRIEVAL=true docker compose up -d api` (needs
      # `stunes llm-tags project` once); /api/health and eval summaries record the value
      LLM_TAGS_IN_RETRIEVAL: ${LLM_TAGS_IN_RETRIEVAL:-false}
      # the re-ranker in chat (docs/prereg-rerank-chat.md): variants in the trace / serve it
      RERANK_VARIANTS: ${RERANK_VARIANTS:-false}
      RERANK_SERVE: ${RERANK_SERVE:-false}
      RERANK_MODEL_PATH: /results/rerank-model-online.txt
      # co-occurrence scoring: count | degree | auto (1/degree weights over the in-memory
      # playlist graph; `stunes ppr-build` writes it, rerun after graph changes). The feed
      # serves degree: Recall@50 0.161 -> 0.193 (docs/results.md); the chat stays count.
      COOCCUR_WEIGHTS_FEED: ${COOCCUR_WEIGHTS_FEED:-degree}
      COOCCUR_WEIGHTS_CHAT: ${COOCCUR_WEIGHTS_CHAT:-count}
      PPR_GRAPH_PATH: /data/ppr/graph.npz
    tmpfs:
      # owned by the image's `app` user: after a container restart the default mount was
      # root:root 0755 and every worker died on its first metric (troubleshooting #19)
      - /run/prom:uid=10001,gid=999,mode=0700
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./results:/results:ro
      - ./.data/ppr:/data/ppr:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      neo4j: { condition: service_healthy }
      postgres: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 12
    profiles: [app]

  web:
    build: web
    image: stunes-web:dev
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api: { condition: service_healthy }
    profiles: [app]

  # `docker compose --profile tools up -d` -> OpenSearch Dashboards :5601 (indices, Discover,
  # Dev Tools for raw queries) and Adminer :8081 (Postgres tables, incl. pgvector rows).
  # Local-only browsers over the same stores; nothing in the app depends on them.
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.9.0
    restart: unless-stopped
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      opensearch: { condition: service_healthy }
    profiles: [tools]

  adminer:
    image: adminer:6.1.2
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:8081:8080"
    depends_on: [postgres]
    profiles: [tools]

  # `docker compose run --rm rerank` -> `stunes rerank train` over .data/rerank (features are
  # built on the host: `stunes rerank features --split val|test`). Its own profile, so
  # `--profile tools up` never starts a training run.
  rerank:
    build: { context: backend, dockerfile: Dockerfile.rerank }
    env_file: .env  # Settings requires the secrets even though training opens no connection
    volumes:
      - ./.data/rerank:/data/rerank
    profiles: [rerank]

  # CDC: Debezium reads the feature tables' committed changes from the WAL and publishes them
  # to Redpanda; `python -m stunes.ingest.cdc_cache` applies them to Redis. With
  # CACHE_WRITER=cdc the ingest consumer writes Postgres only. Connector: infra/cdc/.
  connect:
    image: quay.io/debezium/connect:3.6.2.Final
    restart: unless-stopped
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: stunes-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
      HEAP_OPTS: -Xms256M -Xmx768M
      # the connector config reads the password as ${env:POSTGRES_PASSWORD}, never inline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      postgres: { condition: service_healthy }
      redpanda: { condition: service_healthy }
    profiles: [cdc]

  # Phase 7: `docker compose --profile monitoring up -d` -> Prometheus :9090, Grafana :3001
  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9090:9090"
    profiles: [monitoring]

  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-change-me}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on: [prometheus]
    profiles: [monitoring]

volumes:
  prometheus_data:
  redpanda_data:
  neo4j_data:
    name: stunes_neo4j_data
  neo4j_plugins:
  pg_data:
  os_data:
